name: Update Stats

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0 点(北京 8 点)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate stats SVGs
        run: python3 generate_stats.py "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg
          git diff --cached --quiet || (git commit -m "chore: update stats $(date -u +%F)" && git push)
